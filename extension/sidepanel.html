<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agno Sidepanel</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="panel-shell">
      <div class="panel-top">
        <div class="panel-title">
          <div class="mark">A</div>
          <div class="title-text">
            <div class="name">Agno Bridge</div>
            <div class="subtitle">Browser automation agent</div>
          </div>
        </div>
        <div class="top-actions">
          <!-- Same two pickers as popup.html (both documents share popup.js,
               which populates them from GET /agent/models and treats an absent
               select as "not offered here"). -->
          <select id="modelSelect" title="Model provider">
            <option value="">Default model</option>
          </select>
          <select id="styleSelect" title="Reasoning style">
            <option value="">Auto style</option>
          </select>
          <span id="statusBox" class="status-pill" data-state="idle">
            <span class="status-dot"></span>
            <span class="status-text">Ready</span>
          </span>
          <button id="clearBtn" class="icon-btn" title="Clear conversation" aria-label="Clear conversation">↺</button>
        </div>
      </div>

      <div class="panel-body">
        <div class="left">
          <div id="messages" class="messages" role="log" aria-live="polite"></div>
          <div class="composer">
            <div class="composer-row">
              <input id="quickCmd" placeholder="Ask Agno or run a tool…" autocomplete="off" />
              <button id="sendBtn" class="send">Send</button>
            </div>
            <div class="composer-meta">
              <label class="meta-item"><input id="browserToolsInput" type="checkbox" checked /> Browser tools</label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
